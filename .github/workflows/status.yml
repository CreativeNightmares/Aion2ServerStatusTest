name: Check AION 2 server status

on:
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to save state.json back to the repo

concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AION_SERVER: ${{ secrets.AION_SERVER }}
          AION_REGION: ${{ secrets.AION_REGION }}
        run: python check_status.py

      - name: Save state
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "Update state" && git push)
